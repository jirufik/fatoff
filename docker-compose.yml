name: fatoff

# Прод целиком: база и приложение в одном стеке (D-066).
#
# Раньше база жила отдельным файлом и отдельным проектом `fatoff-postgresql`, и
# в списке стеков прод выглядел как две несвязанные записи. Это не только
# некрасиво: остановить прод одной командой было нельзя, а `extends` из второго
# файла однажды уже развёл два разных тома — какой окажется под сервисом,
# зависело от того, чем его запустили в этот раз.
#
# Develop с самого начала собран так же, одним файлом.

services:
  postgresql:
    image: postgres:17
    container_name: fatoff-postgresql
    restart: unless-stopped
    ports:
      - "5482:5432"
    environment:
      POSTGRES_USER: fatoff
      POSTGRES_PASSWORD: fatoff
      POSTGRES_DB: fatoff
      TZ: UTC
    volumes:
      - fatoff-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fatoff -d fatoff"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [fatoff-net]

  app:
    build: .
    container_name: fatoff-app
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "4090:4090"
    # своя сеть — чтобы резолвился postgresql; общая — чтобы до контейнера
    # дотянулся туннель, не открывая ни одного порта наружу
    networks: [fatoff-net, local-gate-net]
    environment:
      NODE_ENV: production
      PORT: 4090
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # база прода задана здесь, а не через ${...}: в `.env` лежат настройки
      # разработки, и подстановка увела бы контейнер на базу разработки (D-043)
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: fatoff
      DB_USER: fatoff
      DB_PASSWORD: fatoff
      DB_AUTO_MIGRATE: true
      APP_PASSWORD: ${APP_PASSWORD:?задайте APP_PASSWORD в .env}
      SESSION_SECRET: ${SESSION_SECRET:?задайте SESSION_SECRET в .env}
      SECRETS_KEY: ${SECRETS_KEY:?задайте SECRETS_KEY в .env — openssl rand -hex 32}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      YAZIO_API_BASE: ${YAZIO_API_BASE:-https://yzapi.yazio.com}
      YAZIO_API_VERSION: ${YAZIO_API_VERSION:-v9}
      # пара приложения YAZIO — только из .env, в репозитории её нет (D-086)
      YAZIO_CLIENT_ID: ${YAZIO_CLIENT_ID}
      YAZIO_CLIENT_SECRET: ${YAZIO_CLIENT_SECRET}
      YAZIO_CONCURRENCY: ${YAZIO_CONCURRENCY:-6}
      YAZIO_RESYNC_DAYS: ${YAZIO_RESYNC_DAYS:-3}
      YAZIO_TIMEOUT_MS: ${YAZIO_TIMEOUT_MS:-30000}
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/secrets/service-account.json
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      HEALTH_DIR: /app/health
      EXPORT_DIR: /app/storage/exports
      EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-30}
      # расписания на проде работают: время синхронизации и проверки Drive
      # задаётся у каждого аккаунта в интерфейсе
      SCHEDULES_ENABLED: true
    volumes:
      - fatoff-exports:/app/storage/exports
      # каталог с выгрузками Apple Health — только на чтение: файл в два
      # гигабайта через браузер не загрузить, сервис берёт его с диска
      - ./apple-health:/app/health:ro
      # ключ сервисного аккаунта Google — только на чтение, как и всё чужое
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

# имена заданы явно: иначе compose приписал бы к ним имя проекта
volumes:
  fatoff-postgresql-data:
    name: fatoff-postgresql-data
  fatoff-exports:
    name: fatoff-exports

networks:
  fatoff-net:
    name: fatoff-net
  # Публикацией наружу заведует отдельный проект local-gate: он держит один
  # туннель на все локальные сервисы и по своему файлу решает, что и под каким
  # именем видно. Сюда он приходит по этой общей сети (D-070).
  local-gate-net:
    external: true
    name: local-gate-net
