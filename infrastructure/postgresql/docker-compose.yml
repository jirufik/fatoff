name: fatoff-postgresql

services:
  postgresql:
    image: postgres:17
    container_name: fatoff-postgresql
    restart: unless-stopped
    ports:
      - "5482:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fatoff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fatoff}
      POSTGRES_DB: ${POSTGRES_DB:-fatoff}
      TZ: UTC
    volumes:
      - fatoff-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fatoff} -d ${POSTGRES_DB:-fatoff}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [fatoff-net]

volumes:
  fatoff-postgresql-data:
    name: fatoff-postgresql-data

networks:
  fatoff-net:
    name: fatoff-net
