# Туннель в прод — образец. Настоящий `config.yml` рядом, но в репозиторий не
# едет: в нём адрес сервиса, идентификатор туннеля и путь к ключам, а это
# опознаватели конкретной установки (D-062).
#
#   cp config.example.yml config.yml   и подставить своё
#
# Идентификатор туннеля сам по себе не секрет — секрет лежит в файле ключей
# рядом с ним, в ~/.cloudflared. Он вне репозитория и в образ не попадает:
# контейнер монтирует его только на чтение.

tunnel: <идентификатор-туннеля>
credentials-file: /etc/cloudflared/creds/<идентификатор-туннеля>.json

# Туннель знает ровно один адрес. Всё, что пришло с другим именем, получает 404
# и до сервиса не доходит: список правил — это и есть граница, за которую
# Cloudflare пустить не может, даже ошибившись настройкой.
ingress:
  - hostname: <ваш-домен>
    service: http://fatoff-app:4090
  - service: http_status:404
