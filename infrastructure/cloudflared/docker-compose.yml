name: fatoff-cloudflared

# Публичный вход в прод: адрес задаётся в `config.yml` рядом (он вне репозитория)
#
# Туннель держит исходящее соединение к Cloudflare — дома не открывается ни
# одного порта, роутер не настраивается, смена внешнего IP провайдера ничего не
# ломает. Обойти вход нельзя: публичного порта, на который можно постучаться в
# обход, не существует вовсе.
#
# Сам по себе туннель — только транспорт, он никого не спрашивает, кто пришёл.
# Кто пройдёт дальше, решает Cloudflare Access перед ним, а пароль приложения
# остаётся вторым рубежом.
#
# Поднимается отдельно от сервиса — `pnpm tunnel:up`. Сервис должен уметь жить
# без публичного входа: туннель выключается одной командой, и остаётся прежний
# локальный fatoff.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fatoff-cloudflared
    restart: unless-stopped
    # образ запускается от 65532, а ключи туннеля в ~/.cloudflared принадлежат
    # хозяину машины и лежат под 600 — читать их надо его же правами
    user: "1000:1000"
    command: --config /etc/cloudflared/config.yml tunnel run
    volumes:
      - ./config.yml:/etc/cloudflared/config.yml:ro
      # ключи кладутся по нейтральному пути: домашний каталог хозяина машины
      # называть внутри контейнера незачем, а в репозитории — тем более
      - ${HOME}/.cloudflared:/etc/cloudflared/creds:ro
    # та же сеть, что у сервиса, — туннель ходит в fatoff-app напрямую, минуя
    # хост, поэтому порт наружу приложению не нужен вовсе
    networks: [fatoff-net]

networks:
  fatoff-net:
    external: true
    name: fatoff-net
